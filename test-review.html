<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeLens AI - Code Review Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        textarea, select, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Consolas', 'Monaco', monospace;
            margin-bottom: 20px;
        }
        textarea {
            min-height: 300px;
            resize: vertical;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #results {
            display: none;
        }
        .issue {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
        }
        .issue.critical {
            border-left-color: #dc3545;
        }
        .issue.warning {
            border-left-color: #ffc107;
        }
        .issue.info {
            border-left-color: #17a2b8;
        }
        .issue-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        .issue-desc {
            color: #666;
            margin-bottom: 10px;
        }
        .issue-code {
            background: #2d3748;
            color: #a0aec0;
            padding: 10px;
            border-radius: 4px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            margin: 8px 0;
        }
        .score {
            font-size: 48px;
            font-weight: 700;
            text-align: center;
            margin: 20px 0;
        }
        .score.good { color: #28a745; }
        .score.medium { color: #ffc107; }
        .score.bad { color: #dc3545; }
        .section-title {
            font-size: 1.5rem;
            margin: 20px 0 15px 0;
            color: #667eea;
            font-weight: 600;
        }
        .loading {
            text-align: center;
            color: #667eea;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 CodeLens AI - Code Review</h1>
        
        <div class="card">
            <h2>Submit Code for Review</h2>
            <form id="codeForm">
                <label for="language">Programming Language</label>
                <select id="language">
                    <option value="javascript">JavaScript</option>
                    <option value="typescript">TypeScript</option>
                    <option value="python">Python</option>
                    <option value="java">Java</option>
                    <option value="cpp">C++</option>
                    <option value="go">Go</option>
                    <option value="rust">Rust</option>
                </select>

                <label for="fileName">File Name (optional)</label>
                <input type="text" id="fileName" placeholder="example.js">

                <label for="code">Paste Your Code</label>
                <textarea id="code" placeholder="// Paste your code here..." required></textarea>

                <button type="submit" id="submitBtn">Analyze Code</button>
            </form>
        </div>

        <div id="results" class="card">
            <h2>Analysis Results</h2>
            <div id="resultsContent"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080/api/public/review/analyze';

        document.getElementById('codeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const code = document.getElementById('code').value;
            const language = document.getElementById('language').value;
            const fileName = document.getElementById('fileName').value || `example.${language === 'javascript' ? 'js' : language}`;
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Analyzing...';
            
            document.getElementById('results').style.display = 'block';
            document.getElementById('resultsContent').innerHTML = '<p class="loading">⏳ Analyzing your code...</p>';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ code, language, fileName })
                });

                const result = await response.json();
                
                if (result.success) {
                    displayResults(result.data);
                } else {
                    document.getElementById('resultsContent').innerHTML = `<p style="color: red;">Error: ${result.message}</p>`;
                }
            } catch (error) {
                document.getElementById('resultsContent').innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Analyze Code';
            }
        });

        function displayResults(data) {
            const scoreClass = data.overallScore >= 70 ? 'good' : data.overallScore >= 40 ? 'medium' : 'bad';
            
            let html = `
                <div class="score ${scoreClass}">${data.overallScore}/100</div>
                <p style="text-align: center; color: #666; margin-bottom: 30px;">
                    ${data.linesAnalyzed} lines analyzed in ${data.analysisTime}
                </p>
            `;

            if (data.bugs.length > 0) {
                html += `<div class="section-title">🐛 Bugs (${data.bugs.length})</div>`;
                data.bugs.forEach(issue => {
                    html += formatIssue(issue);
                });
            }

            if (data.security.length > 0) {
                html += `<div class="section-title">🔒 Security Issues (${data.security.length})</div>`;
                data.security.forEach(issue => {
                    html += formatIssue(issue);
                });
            }

            if (data.performance.length > 0) {
                html += `<div class="section-title">⚡ Performance (${data.performance.length})</div>`;
                data.performance.forEach(issue => {
                    html += formatIssue(issue);
                });
            }

            if (data.suggestions.length > 0) {
                html += `<div class="section-title">💡 Suggestions (${data.suggestions.length})</div>`;
                data.suggestions.forEach(issue => {
                    html += formatIssue(issue);
                });
            }

            if (data.bugs.length === 0 && data.security.length === 0 && data.performance.length === 0 && data.suggestions.length === 0) {
                html += '<p style="text-align: center; color: #28a745; font-size: 18px;">✅ No issues found! Great code!</p>';
            }

            document.getElementById('resultsContent').innerHTML = html;
        }

        function formatIssue(issue) {
            return `
                <div class="issue ${issue.severity}">
                    <div class="issue-title">${issue.title} <span style="font-size: 12px; color: #999;">Line ${issue.line || 'N/A'}</span></div>
                    <div class="issue-desc">${issue.description}</div>
                    ${issue.code ? `<div style="color: #999; font-size: 12px;">Problem:</div><div class="issue-code">${escapeHtml(issue.code)}</div>` : ''}
                    ${issue.suggestion ? `<div style="color: #28a745; font-size: 12px; margin-top: 8px;">Suggestion:</div><div class="issue-code" style="background: #d4edda; color: #155724;">${escapeHtml(issue.suggestion)}</div>` : ''}
                </div>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Add sample code on load
        document.getElementById('code').value = `const fetchUser = async (userId) => {
    const apiKey = "hardcoded_api_key_12345";
    const response = await fetch(\`/api/users/\${userId}\`, {
        headers: { 'Authorization': apiKey }
    });
    return await response.json();
}

for (let i = 0; i <= users.length; i++) {
    console.log(users[i].name);
}`;
    </script>
</body>
</html>
