version: 1.0

# This file is used when deploying via the AWS App Runner console
# for the Next.js frontend service.

run:
  command: "npm start -- -p 8080 -H 0.0.0.0"
  network:
    port: 8080
    env: PORT
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "8080"
    - name: HOSTNAME
      value: "0.0.0.0"
    - name: NEXT_TELEMETRY_DISABLED
      value: "1"
    # Set this to your actual backend App Runner URL
    - name: NEXT_PUBLIC_API_URL
      value: "https://<backend-app-runner-url>/api"
    - name: NEXT_PUBLIC_APP_NAME
      value: "CodeLens AI"
