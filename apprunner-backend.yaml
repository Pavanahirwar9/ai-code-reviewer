version: 1.0
runtime: nodejs18  # only used for source-based deploys; ignored for ECR image deploys

# This file is used when deploying via the AWS App Runner console
# (Infrastructure → Create service → Use a configuration file)
# For ECR-based deploys the settings below are applied once the image is pulled.

run:
  runtime-version: ""          # ignored for ECR image deployments
  command: "node src/server.js"
  network:
    port: 8080
    env: PORT
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "8080"
    - name: OPENAI_MODEL
      value: gpt-4o-mini
    - name: RATE_LIMIT_WINDOW
      value: "15"
    - name: RATE_LIMIT_MAX
      value: "100"
    # Secrets injected from AWS Secrets Manager (set ARNs in App Runner console or CLI)
    - name: MONGODB_URI
      secret-arn: "arn:aws:secretsmanager:REGION:ACCOUNT_ID:secret:ai-code-review/backend:MONGODB_URI::"
    - name: JWT_SECRET
      secret-arn: "arn:aws:secretsmanager:REGION:ACCOUNT_ID:secret:ai-code-review/backend:JWT_SECRET::"
    - name: OPENAI_API_KEY
      secret-arn: "arn:aws:secretsmanager:REGION:ACCOUNT_ID:secret:ai-code-review/backend:OPENAI_API_KEY::"
    - name: GITHUB_CLIENT_ID
      secret-arn: "arn:aws:secretsmanager:REGION:ACCOUNT_ID:secret:ai-code-review/backend:GITHUB_CLIENT_ID::"
    - name: GITHUB_CLIENT_SECRET
      secret-arn: "arn:aws:secretsmanager:REGION:ACCOUNT_ID:secret:ai-code-review/backend:GITHUB_CLIENT_SECRET::"
    - name: GOOGLE_CLIENT_ID
      secret-arn: "arn:aws:secretsmanager:REGION:ACCOUNT_ID:secret:ai-code-review/backend:GOOGLE_CLIENT_ID::"
    - name: GOOGLE_CLIENT_SECRET
      secret-arn: "arn:aws:secretsmanager:REGION:ACCOUNT_ID:secret:ai-code-review/backend:GOOGLE_CLIENT_SECRET::"
    - name: SESSION_SECRET
      secret-arn: "arn:aws:secretsmanager:REGION:ACCOUNT_ID:secret:ai-code-review/backend:SESSION_SECRET::"
    - name: EMAIL_HOST
      secret-arn: "arn:aws:secretsmanager:REGION:ACCOUNT_ID:secret:ai-code-review/backend:EMAIL_HOST::"
    - name: EMAIL_PORT
      secret-arn: "arn:aws:secretsmanager:REGION:ACCOUNT_ID:secret:ai-code-review/backend:EMAIL_PORT::"
    - name: EMAIL_USER
      secret-arn: "arn:aws:secretsmanager:REGION:ACCOUNT_ID:secret:ai-code-review/backend:EMAIL_USER::"
    - name: EMAIL_PASS
      secret-arn: "arn:aws:secretsmanager:REGION:ACCOUNT_ID:secret:ai-code-review/backend:EMAIL_PASS::"
    - name: EMAIL_FROM
      secret-arn: "arn:aws:secretsmanager:REGION:ACCOUNT_ID:secret:ai-code-review/backend:EMAIL_FROM::"
    # Set after frontend is deployed:
    # - name: FRONTEND_URL
    #   value: "https://<frontend-app-runner-url>"
    # - name: BACKEND_URL
    #   value: "https://<backend-app-runner-url>"
